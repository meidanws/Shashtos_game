name: CI

# Runs on pull requests. Pushes to main are covered by the deploy workflow,
# which runs the same checks before it publishes, so nothing is duplicated.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` runs `vue-tsc --noEmit` first, so this covers
      # type-checking as well as the production bundle.
      - name: Build
        run: npm run build
